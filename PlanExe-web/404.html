<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0; url=https://planexe.org/" />
    <script>
      (function () {
        var path = window.location.pathname || "";
        var newOrigin = "https://planexe.org";
        var newPath = path.replace(/^\/PlanExe-web\/?/, "/");
        var newUrl = newOrigin + newPath + window.location.search + window.location.hash;
        window.location.replace(newUrl);
      })();
    </script>
  </head>
  <body>
    <p>
      Redirecting to
      <a href="https://planexe.org/">planexe.org</a>
      …
    </p>
  </body>
</html>
