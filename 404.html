<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page not found</title>
    <script>
      (function () {
        var path = window.location.pathname || "";
        if (path === "/PlanExe-web" || path.indexOf("/PlanExe-web/") === 0) {
          var newOrigin = "https://planexe.org";
          var newPath = path.replace(/^\/PlanExe-web\/?/, "/");
          var newUrl = newOrigin + newPath + window.location.search + window.location.hash;
          window.location.replace(newUrl);
        }
      })();
    </script>
  </head>
  <body>
    <h1>404</h1>
    <p>This page does not exist.</p>
    <p>
      If you were looking for PlanExe-Web, it moved to
      <a href="https://planexe.org/">planexe.org</a>.
    </p>
  </body>
</html>
